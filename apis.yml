apis:
- name: CMR STAC API
  description: >-
    The CMR SpatioTemporal Asset Catalog (STAC) API provides a STAC-compliant interface over NASA's Common
    Metadata Repository, enabling discovery and access to Earth science data collections and items using
    the widely-adopted STAC specification. Supports provider-specific STAC catalogs for individual NASA
    DAACs.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.earthdata.nasa.gov/engage/open-data-services-software/earthdata-developer-portal/cmr-api
  baseURL: https://cmr.earthdata.nasa.gov/stac
  tags:
  - STAC
  - SpatioTemporal
  - Collections
  - Items
  - Geospatial
  properties:
  - type: Documentation
    url: https://github.com/nasa/cmr-stac/blob/master/docs/usage/usage.md
  contact:
  - FN: NASA Earthdata
    url: https://www.earthdata.nasa.gov/contact
    email: support@earthdata.nasa.gov
- name: Earthdata Login API
  description: >-
    The Earthdata Login API provides free and immediate access to thousands of EOSDIS data products covering
    all Earth science disciplines. It manages user authentication and profile management using OAuth2
    and Single Sign-On (SSO), enabling applications to query user information and manage access tokens
    without maintaining separate user databases.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.earthdata.nasa.gov/engage/open-data-services-software/earthdata-developer-portal/earthdata-login-api
  baseURL: https://urs.earthdata.nasa.gov
  tags:
  - Authentication
  - OAuth2
  - SSO
  - User Management
  - Access Control
  properties:
  - type: Documentation
    url: >-
      https://www.earthdata.nasa.gov/engage/open-data-services-software/earthdata-developer-portal/earthdata-login-api
  contact:
  - FN: NASA Earthdata
    url: https://www.earthdata.nasa.gov/contact
    email: support@earthdata.nasa.gov
- name: AppEEARS API
  description: >-
    The Application for Extracting and Exploring Analysis Ready Samples (AppEEARS) API offers a RESTful
    interface for submitting and managing area or point-based data extraction tasks from NASA Earth science
    datasets. Supports multiple output formats including GeoTIFF, NetCDF4, and ENVI, with asynchronous
    job processing and direct cloud-based S3 data access.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://appeears.earthdatacloud.nasa.gov/api/
  baseURL: https://appeears.earthdatacloud.nasa.gov/api
  tags:
  - Data Extraction
  - Analysis Ready
  - GeoTIFF
  - NetCDF
  - Time Series
  properties:
  - type: Documentation
    url: https://appeears.earthdatacloud.nasa.gov/api/
  contact:
  - FN: NASA Earthdata
    url: https://www.earthdata.nasa.gov/contact
    email: support@earthdata.nasa.gov
- name: Global Imagery Browse Services (GIBS) API
  description: >-
    The Global Imagery Browse Services (GIBS) API delivers quick access to over 1,000 satellite imagery
    products through standards-compliant web services including WMTS, WMS, and Tiled Web Map Service (TWMS).
    Provides full-resolution global imagery with most datasets updated daily within hours of satellite
    observation. Supports multiple map projections and quality tiers with no authentication required for
    public imagery.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://www.earthdata.nasa.gov/engage/open-data-services-software/earthdata-developer-portal/gibs-api
  baseURL: https://gibs.earthdata.nasa.gov
